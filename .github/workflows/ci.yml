name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      e2e-matrix:
        description: 'E2E projects: "tiered" (core + tagged tests) or "full" (every test on all 9)'
        type: choice
        options: [tiered, full]
        default: tiered
  # specs/stack.md F4 "Tiered E2E matrix": the full matrix runs nightly.
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cosmofactory/recetas-frontend

jobs:
  quality:
    name: Lint, Check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      # D-FE2-1: the vendored spec and mock bundle must match the backend's
      # main, and schema.d.ts must be generated from the spec.
      - name: API contract drift
        run: pnpm api:check

      # Vitest's browser project runs component tests in Chromium. The hosted
      # runner already has Chrome's system libraries, so skip --with-deps:
      # its apt step stalled on a slow Ubuntu mirror until the job timed out.
      - name: Install Chromium for component tests
        run: pnpm exec playwright install chromium

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # The suite outgrew one 30-minute job (5k+ tests over every viewport and
  # browser), so it runs as parallel shards; "E2E Smoke" below aggregates
  # them and stays the required check on main.
  e2e-shard:
    name: E2E Shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The official image ships the browsers and their system libraries, so
    # no job waits on apt (a slow Ubuntu mirror cancelled whole shards at
    # 30 minutes). Keep the tag equal to the @playwright/test version; a
    # mismatch fails at launch with "Executable doesn't exist".
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright
        # Firefox refuses to start as root with a HOME it doesn't own, and
        # Actions resets HOME to /github/home for every step.
        env:
          HOME: /root
          E2E_MATRIX: ${{ (github.event_name == 'schedule' || inputs.e2e-matrix == 'full') && 'full' || 'tiered' }}
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: e2e-shard
    # Runs even when a shard fails or is skipped, so the required check
    # reports failure instead of staying pending.
    if: always()

    steps:
      - name: All shards passed
        run: test "${{ needs.e2e-shard.result }}" = success

  build-and-push-image:
    name: Build And Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
      - e2e
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Immutable tags only (sha-<7>, and vX.Y.Z for git tags); no :latest.
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          version="$sha_tag"
          tags="${IMAGE}:${sha_tag}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            tags="${tags}"$'\n'"${IMAGE}:${GITHUB_REF_NAME}"
          fi
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
