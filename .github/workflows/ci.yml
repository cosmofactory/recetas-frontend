name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      e2e-matrix:
        description: 'E2E projects: "tiered" (core + tagged tests) or "full" (every test on all 9)'
        type: choice
        options: [tiered, full]
        default: tiered
  # specs/stack.md F4 "Tiered E2E matrix": the full matrix runs nightly.
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cosmofactory/recetas-frontend
  DEMO_URL: https://demo.asadorov.es

jobs:
  quality:
    name: Lint, Check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # actionlint (with shellcheck) from the digest-pinned image, as in
      # recetas-infra and recetas-backend.
      - name: Lint workflows
        run: pnpm lint:actions

      - name: Type check
        run: pnpm check

      # D-FE2-1: the vendored spec and mock bundle must match the backend's
      # main, and schema.d.ts must be generated from the spec.
      - name: API contract drift
        run: pnpm api:check

      # Vitest's browser project runs component tests in Chromium. The hosted
      # runner already has Chrome's system libraries, so skip --with-deps:
      # its apt step stalled on a slow Ubuntu mirror until the job timed out.
      - name: Install Chromium for component tests
        run: pnpm exec playwright install chromium

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # The suite outgrew one 30-minute job (5k+ tests over every viewport and
  # browser), so it runs as parallel shards; "E2E Smoke" below aggregates
  # them and stays the required check on main.
  e2e-shard:
    name: E2E Shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The official image ships the browsers and their system libraries, so
    # no job waits on apt (a slow Ubuntu mirror cancelled whole shards at
    # 30 minutes). Keep the tag equal to the @playwright/test version; a
    # mismatch fails at launch with "Executable doesn't exist".
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright
        # Firefox refuses to start as root with a HOME it doesn't own, and
        # Actions resets HOME to /github/home for every step.
        env:
          HOME: /root
          E2E_MATRIX: ${{ (github.event_name == 'schedule' || inputs.e2e-matrix == 'full') && 'full' || 'tiered' }}
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: e2e-shard
    # Runs even when a shard fails or is skipped, so the required check
    # reports failure instead of staying pending.
    if: always()

    steps:
      - name: All shards passed
        run: test "${{ needs.e2e-shard.result }}" = success

  # D-FE8-2 (specs/stack.md F4 "Performance budgets"): median LCP and CLS of
  # the home, Variations and Recipe pages on Lighthouse's mobile and desktop
  # presets, against the production build with mock data. The runner's
  # Google Chrome runs it (as a normal user, so no --no-sandbox). The gzip JS
  # budget is a Playwright spec and runs in the E2E shards.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lighthouse mobile
        run: pnpm lhci:mobile

      # Runs even when mobile failed, so one push reports both presets.
      - name: Lighthouse desktop
        if: ${{ !cancelled() }}
        run: pnpm lhci:desktop

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # upload-artifact skips dot-folders unless told otherwise.
          include-hidden-files: true
          retention-days: 7

  build-and-push-image:
    name: Build And Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
      - e2e
      - lighthouse
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      sha-tag: ${{ steps.tags.outputs.sha-tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Immutable tags only (sha-<7>, and vX.Y.Z for git tags); no :latest.
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          version="$sha_tag"
          tags="${IMAGE}:${sha_tag}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            tags="${tags}"$'\n'"${IMAGE}:${GITHUB_REF_NAME}"
          fi
          {
            echo "sha-tag=${sha_tag}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only main deploys, and only once the VM exists (this repo's own
  # DEPLOY_ENABLED variable). The demo environment's key is restricted on the VM to
  # ssh-gate.sh, which runs nothing but deploy-service.sh for the frontend on
  # demo; that script rolls back and exits non-zero when the new image isn't
  # healthy, and keeps the failed container's logs on the VM.
  deploy-demo:
    name: Deploy Demo
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: demo
      url: ${{ env.DEMO_URL }}
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    # No checkout and no GitHub API calls: the token needs no scopes.
    permissions: {}
    # Covers the VM-side deploy lock wait (15 min) plus the health wait.
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      SSH_CONNECT_TIMEOUT_SECONDS: '20'
      SMOKE_ATTEMPTS: '10'
      SMOKE_RETRY_DELAY_SECONDS: '6'
      SMOKE_REQUEST_TIMEOUT_SECONDS: '10'

    steps:
      - name: Write SSH key and known hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"
          echo "SSH_DIR=$SSH_DIR" >> "$GITHUB_ENV"
          install -d -m 700 "$SSH_DIR"
          install -m 600 /dev/null "$SSH_DIR/key"
          install -m 600 /dev/null "$SSH_DIR/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"

      # ssh-gate.sh lets only this command through (and execs it without a shell).
      - name: Deploy the image to demo
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IMAGE_TAG: ${{ needs.build-and-push-image.outputs.sha-tag }}
        run: |
          ssh -i "$SSH_DIR/key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout="$SSH_CONNECT_TIMEOUT_SECONDS" \
            "$SSH_USER@$SSH_HOST" "/srv/recetas/scripts/deploy-service.sh demo frontend $IMAGE_TAG"

      # /readyz asks the backend's /healthz (the API itself isn't public), so
      # it also proves the new frontend reaches the backend. Retries cover
      # Caddy settling after the frontend container was recreated.
      - name: Smoke test demo
        run: |
          smoke() {
            local url=$1 attempt
            for ((attempt = 1; attempt <= SMOKE_ATTEMPTS; attempt++)); do
              if curl -fsSL -o /dev/null --max-time "$SMOKE_REQUEST_TIMEOUT_SECONDS" "$url"; then
                echo "ok: $url"
                return 0
              fi
              echo "attempt $attempt/$SMOKE_ATTEMPTS failed: $url" >&2
              if ((attempt < SMOKE_ATTEMPTS)); then sleep "$SMOKE_RETRY_DELAY_SECONDS"; fi
            done
            return 1
          }
          smoke "$DEMO_URL/"
          smoke "$DEMO_URL/readyz"

      - name: Remove SSH key
        if: always()
        run: rm -rf "${SSH_DIR:-$RUNNER_TEMP/ssh}"
